name: build-apk

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          
      - name: Generate Wrapper and Build
        run: |
          gradle wrapper --gradle-version 8.5
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          
          chmod +x ./gradlew
          
          # Run build and capture EVERYTHING
          ./gradlew assembleDebug --no-daemon --stacktrace > full_log.txt 2>&1 || true
          
          echo "### FULL BUILD LOG" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          # Print the last 30 lines of the log (where the real error hides)
          tail -n 30 full_log.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          
          if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
            exit 1
          fi
          
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SystemSync-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
