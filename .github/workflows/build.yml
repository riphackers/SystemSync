name: build-apk

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          
      - name: Force Gradle Files and Build
        run: |
          # If the files are missing at the root, create them so Gradle stops panicking
          if [ ! -f settings.gradle.kts ]; then
            echo 'rootProject.name = "SystemSync"' > settings.gradle.kts
            echo 'include(":app")' >> settings.gradle.kts
          fi
          
          if [ ! -f build.gradle.kts ]; then
            echo 'plugins {' > build.gradle.kts
            echo '    id("com.android.application") version "8.2.0" apply false' >> build.gradle.kts
            echo '    id("org.jetbrains.kotlin.android") version "1.9.20" apply false' >> build.gradle.kts
            echo '}' >> build.gradle.kts
          fi

          gradle wrapper --gradle-version 8.5
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SystemSync-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
