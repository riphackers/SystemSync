name: build-apk

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          
      - name: Build with Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
          
          # The "|| true" makes sure the step doesn't stop so we can capture the error
          ./gradle-8.5/bin/gradle assembleDebug --no-daemon --stacktrace > build_log.txt 2>&1 || true
          
          echo "### 🚨 REAL BUILD ERRORS 🚨" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          # This grabs only the lines that contain Kotlin errors or failure messages
          grep -E "e: file:///|FAILURE|What went wrong|Execution failed|Caused by" build_log.txt | head -n 20 >> $GITHUB_STEP_SUMMARY || echo "No specific code error found. The issue might be Gradle downloading." >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          
          # Fail the job manually if the APK wasn't built
          if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "APK was not created."
            exit 1
          fi
          
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SystemSync-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
